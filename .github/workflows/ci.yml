# The codec has to answer the daemons on both systems a duck is developed from, and only one
# of them is ever on the desk. macOS is where the work happens; Linux is where the robot's
# own tooling lives, and a shim that parses argv correctly only on a Mac is a trap for
# everyone else.
#
# Neither runner has a sound card, which is why the contract test asks the codec what it
# *would* have exec'd rather than playing anything. Linux installs `alsa-utils` all the
# same: the PATH guard — we are called `aplay` and sit ahead of the system's on purpose —
# can only fail on a host that has a real one to find, so without it the riskiest line in
# the shim would be covered by nothing.
name: ci

on:
  push:
  pull_request:

jobs:
  codec:
    name: codec on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: a real aplay to be shadowed
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils

      - name: the codec answers the daemons
        run: codec/tests/argv.sh

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --shell=sh microduck-twin codec/aplay codec/tests/argv.sh
